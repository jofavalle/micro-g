# AI-assisted: Claude Code (claude-opus-5-5), reviewed by PabloBernal-CPU
# Repository hygiene on every push and every PR: this way it runs even if nobody
# remembers to run it. What it checks is in the header of .github/higiene.py.
name: higiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  higiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: python3 .github/higiene.py
        run: python3 .github/higiene.py
